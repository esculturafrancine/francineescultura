
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Database</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 30px;
        }

        h1, h2 {
            color: #234b35;
        }

        button {
            background: #267447;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #195632;
        }

        .student-card {
            background: white;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 5px solid #267447;
        }

        input {
            padding: 9px;
            margin: 5px;
        }

        #studentList {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>Student Database Management</h1>
    <p>Welcome to Francine Escultura's Student Database.</p>

    <hr>

    <h2>Students from Database</h2>

    <button onclick="loadStudents()">Load Students</button>

    <div id="studentList"></div>

    <hr>

    <h2>Search Student by ID</h2>

    <input type="number" id="studentId" placeholder="Enter student ID">
    <button onclick="loadStudentById()">Search Student</button>

    <div id="singleStudent"></div>

    <hr>

    <h2>Filter Students by Section</h2>

    <input type="text" id="section" placeholder="Enter section (Example: 3B)">
    <button onclick="loadBySection()">Search Section</button>

    <div id="sectionList"></div>

    <script>
        function loadStudents() {
            fetch('/students')
            .then(response => response.json())
            .then(data => {
                let output = '';

                data.forEach(student => {
                    output += `
                        <div class="student-card">
                            <b>${student.student_id}</b><br>
                            Name: ${student.name}<br>
                            Program: ${student.program}<br>
                            Year: ${student.year}<br>
                            Section: ${student.section}
                        </div>
                    `;
                });

                document.getElementById('studentList').innerHTML =
                    output || '<p>No student records found.</p>';
            })
            .catch(error => {
                document.getElementById('studentList').innerHTML =
                    '<p>Unable to retrieve student records.</p>';
            });
        }

        function loadStudentById() {
            const id = document.getElementById('studentId').value;

            if (!id) {
                alert('Please enter a student ID.');
                return;
            }

            fetch('/students/' + id)
            .then(response => response.json())
            .then(student => {
                if (student.error) {
                    document.getElementById('singleStudent').innerHTML =
                        '<p>Student not found.</p>';
                    return;
                }

                document.getElementById('singleStudent').innerHTML = `
                    <div class="student-card">
                        <b>${student.student_id}</b><br>
                        Name: ${student.name}<br>
                        Program: ${student.program}<br>
                        Year: ${student.year}<br>
                        Section: ${student.section}
                    </div>
                `;
            })
            .catch(error => {
                document.getElementById('singleStudent').innerHTML =
                    '<p>Unable to retrieve student.</p>';
            });
        }

        function loadBySection() {
            const section = document.getElementById('section').value.trim();

            if (!section) {
                alert('Please enter a section.');
                return;
            }

            fetch('/students/section/' + encodeURIComponent(section))
            .then(response => response.json())
            .then(data => {
                let output = '';

                data.forEach(student => {
                    output += `
                        <div class="student-card">
                            <b>${student.student_id}</b><br>
                            Name: ${student.name}<br>
                            Program: ${student.program}<br>
                            Year: ${student.year}<br>
                            Section: ${student.section}
                        </div>
                    `;
                });

                document.getElementById('sectionList').innerHTML =
                    output || '<p>No students found in this section.</p>';
            })
            .catch(error => {
                document.getElementById('sectionList').innerHTML =
                    '<p>Unable to retrieve records.</p>';
            });
        }
    </script>

</body>
</html>

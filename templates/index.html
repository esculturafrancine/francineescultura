
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student CRUD Application</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5efff;
            color: #443052;
            padding: 25px;
        }

        header {
            background: linear-gradient(135deg, #9b75c9, #c4a6e8);
            color: white;
            text-align: center;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        header h1 {
            margin-bottom: 10px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(100, 60, 140, 0.10);
        }

        h2 {
            color: #8052ad;
            margin-bottom: 18px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5c1eb;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #9569c6;
            box-shadow: 0 0 5px #d5b8f2;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #9870c5;
            color: white;
            cursor: pointer;
            margin: 5px 3px;
            transition: 0.3s;
        }

        button:hover {
            background: #70449d;
            transform: translateY(-2px);
        }

        .delete-btn {
            background: #d46b8a;
        }

        .delete-btn:hover {
            background: #ae4566;
        }

        .cancel-btn {
            background: #888;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee3fa;
        }

        th {
            background: #eadcf8;
            color: #65418b;
        }

        tr:hover {
            background: #faf6ff;
        }

        .message {
            margin: 12px 0;
            font-weight: bold;
        }

        .search-box {
            margin-bottom: 15px;
        }

        @media(max-width: 600px) {
            body {
                padding: 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Student CRUD Web Application</h1>
    <p>Laboratory Activity 8</p>
    <p>Create, Read, Update and Delete Student Records</p>
</header>

<div class="container">

    <!-- STUDENT FORM -->
    <section class="card">
        <h2 id="formTitle">Add New Student</h2>

        <form id="studentForm">

            <div class="form-grid">

                <input type="text" id="student_id"
                    placeholder="Student ID" required>

                <input type="text" id="name"
                    placeholder="Student Name" required>

                <input type="text" id="program"
                    placeholder="Program (BSIT)" required>

                <input type="number" id="year"
                    placeholder="Year Level" min="1" required>

                <input type="text" id="section"
                    placeholder="Section (3B)" required>

            </div>

            <br>

            <button type="submit" id="submitBtn">
                Add Student
            </button>

            <button type="button" class="cancel-btn"
                onclick="resetForm()">
                Cancel
            </button>

        </form>

        <p id="message" class="message"></p>
    </section>


    <!-- MY RECORDS -->
    <section class="card">

        <h2>My Records</h2>

        <input type="text" id="searchInput"
            class="search-box"
            placeholder="Search student..."
            oninput="loadStudents()">

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Program</th>
                        <th>Year</th>
                        <th>Section</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTable"></tbody>
            </table>
        </div>

    </section>


    <!-- CLASSMATE RECORDS -->
    <section class="card">

        <h2>Classmate's Records</h2>

        <p>Enter your classmate's deployed API URL:</p>

        <input type="url" id="classmateAPI"
            placeholder="https://classmate-app.onrender.com/api/students">

        <button onclick="loadClassmateRecords()">
            Retrieve Classmate Records
        </button>

        <p id="remoteMessage" class="message"></p>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Program</th>
                        <th>Year</th>
                        <th>Section</th>
                        <th>Details</th>
                    </tr>
                </thead>

                <tbody id="classmateTable"></tbody>
            </table>
        </div>

        <div id="remoteDetails"></div>

    </section>

</div>


<script>

    let editingId = null;
    let myStudents = [];
    let remoteStudents = [];

    const API = "/api/students";


    // DISPLAY MESSAGE
    function showMessage(message, color = "green") {
        const msg = document.getElementById("message");
        msg.textContent = message;
        msg.style.color = color;
    }


    // RESET FORM
    function resetForm() {
        document.getElementById("studentForm").reset();

        editingId = null;

        document.getElementById("formTitle").textContent =
            "Add New Student";

        document.getElementById("submitBtn").textContent =
            "Add Student";

        showMessage("");
    }


    // LOAD MY STUDENTS
    async function loadStudents() {

        try {
            const response = await fetch(API);

            if (!response.ok) {
                throw new Error("Unable to load students");
            }

            myStudents = await response.json();

            displayStudents();

        } catch (error) {
            showMessage(error.message, "red");
        }
    }


    // DISPLAY MY STUDENTS
    function displayStudents() {

        const table = document.getElementById("studentTable");

        const search = document.getElementById("searchInput")
            .value.toLowerCase();

        table.innerHTML = "";

        const filtered = myStudents.filter(student =>
            [
                student.student_id,
                student.name,
                student.program,
                student.section
            ].some(value =>
                String(value).toLowerCase().includes(search)
            )
        );

        if (filtered.length === 0) {
            table.innerHTML =
                '<tr><td colspan="7">No student records found.</td></tr>';
            return;
        }

        filtered.forEach(student => {

            const row = document.createElement("tr");

            [
                student.id,
                student.student_id,
                student.name,
                student.program,
                student.year,
                student.section
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            const actions = document.createElement("td");

            const editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.onclick = () => editStudent(student.id);

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";
            deleteButton.onclick = () => deleteStudent(student.id);

            actions.append(editButton, deleteButton);
            row.appendChild(actions);

            table.appendChild(row);
        });
    }


    // ADD OR UPDATE STUDENT
    document.getElementById("studentForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const studentData = {
                student_id: document.getElementById("student_id").value.trim(),
                name: document.getElementById("name").value.trim(),
                program: document.getElementById("program").value.trim(),
                year: document.getElementById("year").value,
                section: document.getElementById("section").value.trim()
            };

            const url = editingId
                ? `${API}/${editingId}`
                : API;

            const method = editingId ? "PUT" : "POST";

            try {

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(studentData)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Operation failed");
                }

                showMessage(result.message);

                resetForm();

                await loadStudents();

            } catch (error) {
                showMessage(error.message, "red");
            }
        });


    // EDIT STUDENT
    function editStudent(id) {

        const student = myStudents.find(s => s.id === id);

        if (!student) return;

        editingId = id;

        document.getElementById("student_id").value =
            student.student_id;

        document.getElementById("name").value =
            student.name;

        document.getElementById("program").value =
            student.program;

        document.getElementById("year").value =
            student.year;

        document.getElementById("section").value =
            student.section;

        document.getElementById("formTitle").textContent =
            "Edit Student";

        document.getElementById("submitBtn").textContent =
            "Update Student";

        window.scrollTo({ top: 0, behavior: "smooth" });
    }


    // DELETE STUDENT
    async function deleteStudent(id) {

        if (!confirm("Are you sure you want to delete this student?")) {
            return;
        }

        try {

            const response = await fetch(`${API}/${id}`, {
                method: "DELETE"
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Delete failed");
            }

            showMessage(result.message);

            await loadStudents();

        } catch (error) {
            showMessage(error.message, "red");
        }
    }


    // RETRIEVE CLASSMATE RECORDS (READ ONLY)
    async function loadClassmateRecords() {

        const url = document.getElementById("classmateAPI")
            .value.trim();

        const message = document.getElementById("remoteMessage");
        const table = document.getElementById("classmateTable");

        if (!url) {
            message.textContent = "Please enter your classmate's API URL.";
            message.style.color = "red";
            return;
        }

        try {

            message.textContent = "Loading records...";

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error("Unable to retrieve classmate records.");
            }

            const data = await response.json();

            if (!Array.isArray(data)) {
                throw new Error("The API must return a JSON list of students.");
            }

            remoteStudents = data;

            table.innerHTML = "";

            if (data.length === 0) {
                table.innerHTML =
                    '<tr><td colspan="7">No classmate records found.</td></tr>';
            }

            data.forEach(student => {

                const row = document.createElement("tr");

                [
                    student.id,
                    student.student_id,
                    student.name,
                    student.program,
                    student.year,
                    student.section
                ].forEach(value => {

                    const cell = document.createElement("td");
                    cell.textContent = value ?? "";
                    row.appendChild(cell);

                });

                const detailsCell = document.createElement("td");
                const detailsButton = document.createElement("button");

                detailsButton.textContent = "View Details";

                detailsButton.onclick = () => {
                    viewRemoteDetails(student);
                };

                detailsCell.appendChild(detailsButton);
                row.appendChild(detailsCell);

                table.appendChild(row);

            });

            message.textContent =
                "Classmate records retrieved successfully!";

            message.style.color = "green";

        } catch (error) {

            message.textContent =
                error.message + " Check the URL and API CORS settings.";

            message.style.color = "red";
        }
    }


    // VIEW REMOTE STUDENT DETAILS
    function viewRemoteDetails(student) {

        const details = document.getElementById("remoteDetails");

        details.innerHTML = "";

        const heading = document.createElement("h3");
        heading.textContent = "Selected Classmate Record";

        const info = document.createElement("pre");
        info.style.whiteSpace = "pre-wrap";
        info.textContent = JSON.stringify(student, null, 2);

        details.append(heading, info);
    }


    // LOAD RECORDS WHEN PAGE OPENS
    loadStudents();

</script>

</body>
</html>
